<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phàm Nhân Thính Âm Các - Tu Tiên Lạc Phổ</title>
  <!-- Google Fonts: Font chữ thư pháp cổ phong & hiện đại -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500;600&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="mood-thanhvan">
  <!-- Canvas nền hạt linh khí và kiếm khí click -->
  <canvas id="ambient-canvas"></canvas>
  <!-- Lớp phủ chớp sét Độ Kiếp -->
  <div id="lightning-overlay"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo">
        <i class="fa-solid fa-yin-yang logo-icon"></i>
        <div class="logo-text">
          <h1>THÍNH ÂM CÁC</h1>
          <span>Phàm Nhân Tu Tiên</span>
        </div>
      </div>

      <!-- Khu vực đổi Cảnh Giới Động Phủ & Chế độ Sáng/Tối -->
      <div class="header-actions">
        <div class="mood-selector" title="Chuyển Hóa Cảnh Động Phủ">
          <i class="fa-solid fa-mountain-sun"></i>
          <select id="mood-dropdown">
            <option value="mood-thanhvan">Thanh Vân Phong</option>
            <option value="mood-loantinhhai">Loạn Tinh Hải</option>
            <option value="mood-dokiep">Độ Kiếp Phong Vân</option>
          </select>
        </div>

        <button id="theme-toggle" class="btn-icon" title="Chuyển đổi Quang Ảnh">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>
    </header>

    <!-- Khu vực chính -->
    <main class="main-content">
      <!-- Cột Trái: Trình phát trung tâm tích hợp Audio Visualizer -->
      <section class="player-section glass-panel">
        <div class="disc-wrapper">
          <!-- Canvas sóng nhạc linh khí ôm sát đĩa -->
          <canvas id="visualizer-canvas" width="340" height="340"></canvas>
          <div class="magic-circle" id="magic-circle"></div>
          <div class="disc" id="disc">
            <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600&auto=format&fit=crop" id="track-cover" alt="Bìa nhạc">
            <div class="disc-core"></div>
          </div>
        </div>

        <div class="track-meta">
          <h2 id="track-title" class="track-title">Phàm Nhân Tu Tiên Tấu Khúc</h2>
          <p id="track-artist" class="track-artist">Hàn Lập • Thanh Vân Môn</p>
        </div>

        <!-- Thanh thời lượng -->
        <div class="progress-container">
          <span id="current-time">00:00</span>
          <div class="progress-bar" id="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <span id="duration">00:00</span>
        </div>

        <!-- Nút điều khiển -->
        <div class="player-controls">
          <button id="shuffle-btn" class="btn-ctrl" title="Hư Không Luân Hồi (Ngẫu nhiên)">
            <i class="fa-solid fa-shuffle"></i>
          </button>
          <button id="prev-btn" class="btn-ctrl" title="Nghịch Chuyển (Trước)">
            <i class="fa-solid fa-backward-step"></i>
          </button>
          <button id="play-btn" class="btn-ctrl btn-play" title="Tác Động Linh Khí (Phát/Dừng)">
            <i class="fa-solid fa-play"></i>
          </button>
          <button id="next-btn" class="btn-ctrl" title="Thuận Hành (Sau)">
            <i class="fa-solid fa-forward-step"></i>
          </button>
          <button id="repeat-btn" class="btn-ctrl" title="Trường Sinh Chu Kỳ (Lặp lại)">
            <i class="fa-solid fa-repeat"></i>
          </button>
        </div>

        <!-- Thanh âm lượng -->
        <div class="volume-container">
          <i class="fa-solid fa-volume-high" id="vol-icon"></i>
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7">
        </div>
      </section>

      <!-- Cột Phải: Danh sách & Quản lý bài hát -->
      <section class="playlist-section glass-panel">
        <div class="playlist-header">
          <h3><i class="fa-solid fa-scroll"></i> Nhập Khúc Bảng</h3>
          <button id="open-modal-btn" class="btn-primary">
            <i class="fa-solid fa-plus"></i> Nạp Âm Lệnh
          </button>
        </div>

        <!-- Danh sách hiển thị bài hát -->
        <div class="playlist-items" id="playlist-items"></div>
      </section>
    </main>
  </div>

  <!-- Audio Engine có thuộc tính crossorigin để chạy Web Audio API không lỗi -->
  <audio id="audio-engine" crossorigin="anonymous" preload="metadata"></audio>

  <!-- Modal nạp thêm nhạc -->
  <div class="modal" id="add-modal">
    <div class="modal-box glass-panel">
      <div class="modal-header">
        <h4>Nạp Thêm Linh Điệu</h4>
        <button class="modal-close" id="close-modal-btn">&times;</button>
      </div>

      <div class="modal-tabs">
        <button class="tab-btn active" data-tab="url">Dẫn Khí (Link URL)</button>
        <button class="tab-btn" data-tab="file">Bản Địa (Tệp MP3)</button>
      </div>

      <div class="modal-body">
        <form id="url-form" class="tab-content active">
          <div class="input-group">
            <label>Khúc Danh (Tên bài)*</label>
            <input type="text" id="url-title" placeholder="VD: Bất Nhiễm, Vấn Đạo..." required>
          </div>
          <div class="input-group">
            <label>Đạo Lữ / Ca Giả (Nghệ sĩ)</label>
            <input type="text" id="url-artist" placeholder="VD: Mao Bất Dịch">
          </div>
          <div class="input-group">
            <label>Phù Lục Âm Thanh (URL MP3)*</label>
            <input type="url" id="url-audio" placeholder="https://domain.com/sound.mp3" required>
          </div>
          <div class="input-group">
            <label>Bìa Linh Ảnh (URL Hình ảnh)</label>
            <input type="url" id="url-cover" placeholder="https://domain.com/cover.jpg">
          </div>
          <button type="submit" class="btn-submit">Khắc Sâu Vào Phổ</button>
        </form>

        <form id="file-form" class="tab-content">
          <div class="input-group">
            <label>Khúc Danh (Tên bài)</label>
            <input type="text" id="file-title" placeholder="Để trống sẽ tự nhận diện theo tên file">
          </div>
          <div class="input-group">
            <label>Đạo Lữ / Ca Giả (Nghệ sĩ)</label>
            <input type="text" id="file-artist" placeholder="Bản địa tu sĩ">
          </div>
          <div class="input-group">
            <label>Chọn Tệp Âm Thanh (.mp3, .wav)*</label>
            <input type="file" id="local-audio-file" accept="audio/*" required>
          </div>
          <button type="submit" class="btn-submit">Dung Nạp Tệp</button>
        </form>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
