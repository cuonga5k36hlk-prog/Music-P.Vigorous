<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phàm Nhân Thính Âm Các - Tu Tiên Lạc Phổ</title>

  <!-- Open Graph -->
  <meta name="description" content="Trang web nghe nhạc phong cách HH3D Phàm Nhân Tu Tiên, âm luật tịnh tâm, giao diện linh khí mượt mà.">
  <meta property="og:title" content="Phàm Nhân Thính Âm Các - Tu Tiên Lạc Phổ">
  <meta property="og:description" content="Trang web nghe nhạc phong cách HH3D Phàm Nhân Tu Tiên, âm luật tịnh tâm, giao diện linh khí mượt mà.">
  <meta property="og:image" content="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1200&auto=format&fit=crop">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cuonga5k36hlk-prog.github.io/Music-P.Vigorous/">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Montserrat:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="mood-thanhvan">
  <canvas id="ambient-canvas"></canvas>
  <div id="lightning-overlay"></div>

  <div class="app-container">
    <header class="app-header">
      <div class="logo">
        <i class="fa-solid fa-yin-yang logo-icon"></i>
        <div class="logo-text">
          <h1>THÍNH ÂM CÁC</h1>
          <span>Phàm Nhân Tu Tiên</span>
        </div>
      </div>

      <!-- Huy Hiệu Tu Vi Cảnh Giới -->
      <div class="cultivation-badge" id="cultivation-badge" title="Tích lũy linh khí theo thời gian thính âm">
        <i class="fa-solid fa-gem"></i>
        <div class="badge-info">
          <span class="realm-title" id="realm-title">Phàm Nhân</span>
          <div class="exp-bar">
            <div class="exp-fill" id="exp-fill" style="width: 0%;"></div>
          </div>
        </div>
        <span class="exp-text" id="exp-text">0m</span>
      </div>

      <div class="header-actions">
        <!-- Chuyển cảnh giới -->
        <div class="mood-selector" title="Chuyển Hóa Cảnh Động Phủ">
          <i class="fa-solid fa-mountain-sun"></i>
          <select id="mood-dropdown">
            <option value="mood-thanhvan">Thanh Vân Phong</option>
            <option value="mood-loantinhhai">Loạn Tinh Hải</option>
            <option value="mood-dokiep">Độ Kiếp Phong Vân</option>
          </select>
        </div>

        <!-- Hẹn giờ tắt -->
        <div class="sleep-timer-wrapper" title="Tịnh Tâm Chi Hạn (Hẹn Giờ)">
          <i class="fa-solid fa-hourglass-half"></i>
          <select id="sleep-timer-select">
            <option value="0">Tắt hẹn giờ</option>
            <option value="15">15 Phút</option>
            <option value="30">30 Phút</option>
            <option value="45">45 Phút</option>
            <option value="60">60 Phút</option>
            <option value="end_of_track">Hết khúc này</option>
          </select>
          <span id="timer-display" class="timer-display"></span>
        </div>

        <!-- Sáng/Tối -->
        <button id="theme-toggle" class="btn-icon" title="Chuyển đổi Quang Ảnh">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>
    </header>

    <main class="main-content">
      <!-- Cột Trái: Trình phát trung tâm -->
      <section class="player-section glass-panel">
        <div class="disc-wrapper">
          <div class="ambient-glow" id="ambient-glow"></div>
          <canvas id="visualizer-canvas" width="360" height="360"></canvas>
          <div class="magic-circle outer-circle" id="magic-circle-outer"></div>
          <div class="magic-circle inner-circle" id="magic-circle-inner"></div>

          <div class="disc" id="disc">
            <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600&auto=format&fit=crop" id="track-cover" alt="Bìa nhạc">
            <div class="disc-core"></div>
          </div>
        </div>

        <div class="track-meta">
          <h2 id="track-title" class="track-title">Phàm Nhân Tu Tiên Tấu Khúc</h2>
          <p id="track-artist" class="track-artist">Hàn Lập • Thanh Vân Môn</p>
        </div>

        <div class="progress-container">
          <span id="current-time">00:00</span>
          <div class="progress-bar" id="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <span id="duration">00:00</span>
        </div>

        <div class="player-controls">
          <button id="shuffle-btn" class="btn-ctrl" title="Hư Không Luân Hồi (Ngẫu nhiên)">
            <i class="fa-solid fa-shuffle"></i>
          </button>
          <button id="prev-btn" class="btn-ctrl" title="Nghịch Chuyển (Trước) [←]">
            <i class="fa-solid fa-backward-step"></i>
          </button>
          <button id="play-btn" class="btn-ctrl btn-play" title="Tác Động Linh Khí (Phát/Dừng) [Space]">
            <i class="fa-solid fa-play"></i>
          </button>
          <button id="next-btn" class="btn-ctrl" title="Thuận Hành (Sau) [→]">
            <i class="fa-solid fa-forward-step"></i>
          </button>
          <button id="repeat-btn" class="btn-ctrl" title="Trường Sinh Chu Kỳ (Lặp lại)">
            <i class="fa-solid fa-repeat"></i>
          </button>
        </div>

        <div class="volume-container">
          <i class="fa-solid fa-volume-high" id="vol-icon" title="Tắt/Bật tiếng [M]"></i>
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7">
        </div>
      </section>

      <!-- Cột Phải: Bộ Quản Lý Album Tông Môn & Bài Hát -->
      <section class="playlist-section glass-panel">
        <div class="playlist-header">
          <!-- Switcher chuyển đổi Danh Sách & Album -->
          <div class="view-switch-tabs">
            <button class="view-tab-btn active" id="view-songs-btn">
              <i class="fa-solid fa-list-ul"></i> Linh Phổ
            </button>
            <button class="view-tab-btn" id="view-albums-btn">
              <i class="fa-solid fa-compact-disc"></i> Album Ca Sĩ
            </button>
          </div>

          <button id="open-modal-btn" class="btn-primary">
            <i class="fa-solid fa-plus"></i> Nạp Âm Lệnh
          </button>
        </div>

        <!-- Thanh Tìm Kiếm -->
        <div class="search-container">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="search-input" placeholder="Linh thức dò tìm (Tên khúc, ca sĩ)...">
        </div>

        <!-- Khung 1: Danh sách bài hát bình thường -->
        <div class="view-content active" id="songs-view">
          <div class="playlist-items" id="playlist-items"></div>
        </div>

        <!-- Khung 2: Danh sách Album theo từng Ca sĩ -->
        <div class="view-content" id="albums-view">
          <!-- Header quay lại khi đang xem chi tiết 1 Album -->
          <div class="album-detail-header" id="album-detail-header" style="display: none;">
            <button class="btn-back-albums" id="btn-back-albums">
              <i class="fa-solid fa-chevron-left"></i> Toàn Bộ Album
            </button>
            <h4 id="album-detail-title">Dangrangto</h4>
          </div>
          <!-- Lưới các Album Ca sĩ -->
          <div class="album-grid" id="album-grid"></div>
        </div>
      </section>
    </main>
  </div>

  <audio id="audio-engine" crossorigin="anonymous" preload="metadata"></audio>

  <!-- Modal Nạp Nhạc -->
  <div class="modal" id="add-modal">
    <div class="modal-box glass-panel">
      <div class="modal-header">
        <h4>Nạp Thêm Linh Điệu</h4>
        <button class="modal-close" id="close-modal-btn">&times;</button>
      </div>

      <div class="modal-tabs">
        <button class="tab-btn active" data-tab="url">Dẫn Khí (Link URL)</button>
        <button class="tab-btn" data-tab="file">Bản Địa (Tệp MP3)</button>
      </div>

      <div class="modal-body">
        <form id="url-form" class="tab-content active">
          <div class="input-group">
            <label>Khúc Danh (Tên bài)*</label>
            <input type="text" id="url-title" placeholder="VD: Món quà, Đánh rơi..." required>
          </div>
          <div class="input-group">
            <label>Đạo Lữ / Ca Giả (Tên Album/Ca sĩ)*</label>
            <input type="text" id="url-artist" placeholder="VD: Dangrangto" required>
          </div>
          <div class="input-group">
            <label>Phù Lục Âm Thanh (URL MP3)*</label>
            <input type="url" id="url-audio" placeholder="https://files.catbox.moe/..." required>
          </div>
          <div class="input-group">
            <label>Bìa Linh Ảnh (URL Hình ảnh)</label>
            <input type="url" id="url-cover" placeholder="https://img.youtube.com/vi/...">
          </div>
          <button type="submit" class="btn-submit">Khắc Sâu Vào Phổ</button>
        </form>

        <form id="file-form" class="tab-content">
          <div class="input-group">
            <label>Khúc Danh (Tên bài)</label>
            <input type="text" id="file-title" placeholder="Để trống sẽ tự nhận diện theo file">
          </div>
          <div class="input-group">
            <label>Đạo Lữ / Ca Giả (Tên Album/Ca sĩ)</label>
            <input type="text" id="file-artist" placeholder="VD: Dangrangto">
          </div>
          <div class="input-group">
            <label>Chọn Tệp Âm Thanh (.mp3, .wav)*</label>
            <input type="file" id="local-audio-file" accept="audio/*" required>
          </div>
          <button type="submit" class="btn-submit">Dung Nạp Tệp</button>
        </form>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
